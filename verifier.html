<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vérification — Carte d'apprentissage LQD Service</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet"/>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    /* ===============================================================
       VARIABLES & RESET
    =============================================================== */
    :root {
      --teal:       #04342C;
      --teal-mid:   #0A5C4A;
      --teal-light: #1A8A6E;
      --accent:     #2ECCA8;
      --orange:     #F5A623;
      --red:        #E05C2A;
      --bg:         #F0F4F2;
      --white:      #FFFFFF;
      --text:       #0D1F1A;
      --text-2:     #3D5A52;
      --text-3:     #7A9E95;
      --border:     #D4E4DF;
      --radius:     16px;
      --shadow:     0 8px 40px rgba(4,52,44,0.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===============================================================
       HEADER
    =============================================================== */
    header {
      background: var(--teal);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
    }

    header .brand {
      display: flex;
      flex-direction: column;
    }

    header .brand-name {
      font-size: 14px;
      font-weight: 700;
      color: #FFF;
      line-height: 1.2;
    }

    header .brand-sub {
      font-size: 11px;
      color: var(--accent);
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.05em;
    }

    header .verif-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    /* ===============================================================
       LAYOUT PRINCIPAL
    =============================================================== */
    main {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px 60px;
    }

    .container {
      width: 100%;
      max-width: 560px;
    }

    /* ===============================================================
       ÉTAT : CHARGEMENT
    =============================================================== */
    .state-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 80px 0;
      text-align: center;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .state-loading p {
      font-size: 14px;
      color: var(--text-2);
    }

    /* ===============================================================
       ÉTAT : ERREUR / EXPIRÉ
    =============================================================== */
    .state-error, .state-expired {
      background: var(--white);
      border-radius: var(--radius);
      padding: 48px 32px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .state-error .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(224,92,42,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .state-expired .icon-wrap {
      background: rgba(245,166,35,0.1);
    }

    .state-error .icon-wrap iconify-icon,
    .state-expired .icon-wrap iconify-icon {
      font-size: 36px;
      color: var(--red);
    }

    .state-expired .icon-wrap iconify-icon { color: var(--orange); }

    .state-error h2, .state-expired h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      color: var(--text);
      margin-bottom: 10px;
    }

    .state-error p, .state-expired p {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.7;
    }

    /* ===============================================================
       CARTE RÉSULTAT — présentée comme un vrai badge officiel (bandeau
       marine + liseré or, sceau d'authentification, statut visuel),
       plutôt que comme un formulaire de données brutes.
    =============================================================== */
    .carte-wrap {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s ease forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(1.3); }
    }

    .id-card {
      background: var(--white);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }

    /* ---------------------------------------------------------------
       EN-TÊTE — bandeau marine, pastille logo blanche, liseré or en
       diagonale (identité visuelle "carte officielle" demandée).
    --------------------------------------------------------------- */
    .id-card-header {
      background: var(--teal);
      padding: 22px 24px 26px;
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      overflow: hidden;
    }

    .id-card-header::after {
      content: "";
      position: absolute;
      top: -40%;
      right: -18%;
      width: 220px;
      height: 220px;
      background: linear-gradient(135deg, var(--orange) 0%, rgba(245,166,35,0.35) 55%, transparent 70%);
      border-radius: 40% 60% 55% 45%;
      opacity: 0.9;
      pointer-events: none;
    }

    .header-logo-badge {
      flex-shrink: 0;
      background: var(--white);
      border-radius: 14px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 78px;
      position: relative;
      z-index: 1;
    }

    .header-logo-badge img {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      object-fit: cover;
    }

    .header-logo-badge strong {
      font-size: 9px;
      font-weight: 800;
      color: var(--teal);
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .header-logo-badge span {
      font-size: 7px;
      color: var(--text-3);
      font-style: italic;
      white-space: nowrap;
    }

    .header-brand-text {
      flex: 1;
      min-width: 0;
      position: relative;
      z-index: 1;
      padding-top: 4px;
    }

    .header-brand-text strong {
      display: block;
      font-size: 15px;
      font-weight: 800;
      color: #FFF;
      letter-spacing: 0.01em;
      line-height: 1.25;
    }

    .header-brand-text .header-tagline {
      display: block;
      font-size: 9.5px;
      font-weight: 700;
      color: var(--orange);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 5px 0;
    }

    .header-brand-text em {
      display: block;
      font-style: italic;
      font-size: 11.5px;
      color: rgba(255,255,255,0.75);
    }

    /* ---------------------------------------------------------------
       PHOTO + IDENTITÉ — centrées, grande photo, nom sur deux niveaux
       (prénom(s) puis nom de famille flanqué de tirets or).
    --------------------------------------------------------------- */
    .id-card-photo-wrap {
      display: flex;
      justify-content: center;
      margin-top: -34px;
      position: relative;
      z-index: 2;
    }

    .id-card-photo {
      width: 128px;
      height: 128px;
      border-radius: 18px;
      overflow: hidden;
      background: var(--bg);
      border: 4px solid var(--white);
      outline: 2px solid var(--orange);
      box-shadow: 0 6px 18px rgba(4,52,44,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .id-card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .id-card-photo .no-photo {
      font-size: 46px;
      color: var(--text-3);
    }

    .id-card-identite {
      text-align: center;
      padding: 14px 28px 4px;
    }

    .apprenant-prenom {
      font-family: 'DM Serif Display', serif;
      font-size: 25px;
      color: var(--teal);
      line-height: 1.25;
      word-break: break-word;
    }

    .apprenant-nomfamille {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 6px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--teal-mid);
    }

    .apprenant-nomfamille .rule {
      width: 34px;
      height: 2px;
      background: var(--orange);
      flex-shrink: 0;
    }

    .apprenant-id {
      font-family: 'DM Mono', monospace;
      font-size: 11.5px;
      color: var(--text-3);
      margin-top: 10px;
      letter-spacing: 0.02em;
    }

    .apprenant-id strong { color: var(--text-2); font-weight: 700; }

    /* ---------------------------------------------------------------
       PANNEAU D'INFOS — deux lignes (Formation / Statut) + ligne
       secondaire (Début) sous un séparateur, chacune avec pastille
       d'icône colorée à gauche.
    --------------------------------------------------------------- */
    .id-card-panel {
      padding: 22px 28px 10px;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 16px;
      margin-bottom: 12px;
    }

    .info-icon {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
      font-size: 18px;
    }

    .info-icon.teal { background: var(--teal-mid); }
    .info-icon.gold { background: var(--orange); }

    .info-text { flex: 1; min-width: 0; }

    .info-label {
      font-size: 9.5px;
      font-weight: 800;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.09em;
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .info-sub {
      font-size: 11.5px;
      color: var(--text-2);
      margin-top: 1px;
    }

    .statut-pill {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 13px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .statut-pill.en-cours { background: rgba(245,166,35,0.18); color: #B4740F; }
    .statut-pill.termine  { background: rgba(15,110,86,0.14); color: var(--teal-mid); }

    .id-card-divider {
      height: 1px;
      background: var(--border);
      margin: 6px 0 14px;
    }

    .info-row.compact {
      background: transparent;
      border: none;
      padding: 0 2px;
      margin-bottom: 4px;
    }

    .info-row.compact .info-icon {
      width: 30px;
      height: 30px;
      font-size: 15px;
      background: rgba(4,52,44,0.08);
      color: var(--teal-mid);
    }

    .info-row.compact .info-value { font-size: 13.5px; }

    /* ---------------------------------------------------------------
       RUBAN DÉCORATIF — coin bas-droit, écho du liseré or de l'en-tête,
       signature cursive de marque.
    --------------------------------------------------------------- */
    .id-card-ribbon-wrap {
      position: relative;
      height: 58px;
      margin-top: 8px;
      overflow: hidden;
    }

    .id-card-ribbon-wrap::before {
      content: "";
      position: absolute;
      right: -10%;
      bottom: -60%;
      width: 260px;
      height: 200px;
      background: linear-gradient(135deg, var(--orange) 0%, var(--teal) 62%);
      border-radius: 45% 55% 60% 40%;
      transform: rotate(-8deg);
    }

    .id-card-ribbon {
      position: absolute;
      right: 22px;
      bottom: 12px;
      font-family: 'Great Vibes', cursive;
      font-size: 19px;
      line-height: 1.15;
      color: #FFF;
      text-align: right;
      text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }

    /* Bouton téléchargement PDF */
    .btn-pdf {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      margin-top: 20px;
      padding: 14px 24px;
      background: var(--teal);
      color: #FFF;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: 'DM Sans', sans-serif;
    }

    .btn-pdf:hover  { background: var(--teal-mid); }
    .btn-pdf:active { transform: scale(0.98); }
    .btn-pdf iconify-icon { font-size: 18px; }

    /* ===============================================================
       ÉTAT : FORMULAIRE DE VÉRIFICATION MANUELLE
       (arrivée sans QR — via l'URL /verifier-document tapée à la main)
    =============================================================== */
    .state-form {
      background: var(--white);
      border-radius: var(--radius);
      padding: 40px 32px;
      box-shadow: var(--shadow);
    }

    .state-form .icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(4,52,44,0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .state-form .icon-wrap iconify-icon { font-size: 30px; color: var(--teal); }

    .state-form h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 21px;
      color: var(--text);
      text-align: center;
      margin-bottom: 8px;
    }

    .state-form p.intro {
      font-size: 13px;
      color: var(--text-2);
      text-align: center;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-2);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: 'DM Mono', monospace;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.2s;
      text-transform: uppercase;
    }

    .form-input:focus { border-color: var(--teal-light); background: var(--white); }

    .form-hint {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 8px;
      line-height: 1.6;
    }

    .form-erreur {
      display: none;
      font-size: 13px;
      color: var(--red);
      background: rgba(224,92,42,0.08);
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 14px;
      line-height: 1.5;
    }

    .btn-verifier {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      margin-top: 20px;
      padding: 14px 24px;
      background: var(--teal);
      color: #FFF;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: 'DM Sans', sans-serif;
    }

    .btn-verifier:hover  { background: var(--teal-mid); }
    .btn-verifier:active { transform: scale(0.98); }
    .btn-verifier:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ===============================================================
       RESPONSIVE
    =============================================================== */
    @media (max-width: 480px) {
      .apprenant-prenom  { font-size: 21px; }
      .header-brand-text strong { font-size: 13px; }
      .id-card-header    { padding: 20px 18px 24px; }
      .id-card-panel     { padding: 20px 18px 8px; }
      .id-card-identite  { padding: 14px 18px 4px; }
    }
  </style>
</head>
<body>
  <div id="bandeau-info" style="display:none;background:#04342C;border-bottom:2px solid #F5A623;overflow:hidden;position:relative;white-space:nowrap;">
    <div style="display:inline-flex;align-items:center;gap:8px;background:#A6402F;color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;padding:6px 14px;position:relative;z-index:2;">
      <span style="width:7px;height:7px;border-radius:50%;background:#fff;display:inline-block;animation:bandeau-pulse 1.4s infinite;"></span>
      EN DIRECT
    </div>
    <div style="display:inline-block;overflow:hidden;vertical-align:middle;width:calc(100% - 100px);">
      <div id="bandeau-texte" style="width:100%;text-align:center;padding:6px 0;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:1;">
      </div>
    </div>
  </div>
  <style>
    @keyframes bandeau-pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
    @keyframes bandeau-sortie { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-10px); } }
    @keyframes bandeau-entree { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    #bandeau-texte.sortant { animation: bandeau-sortie .35s ease forwards; }
    #bandeau-texte.entrant { animation: bandeau-entree .35s ease forwards; }
  </style>


  <header>
    <img src="icons/logo-lqd-v2.jpg" alt="LQD Service"/>
    <div class="brand">
      <span class="brand-name">LQD Service</span>
      <span class="brand-sub">VÉRIFICATION DE DOCUMENT</span>
    </div>
    <div class="verif-badge">
      <iconify-icon icon="tabler:shield-check"></iconify-icon>
      Système officiel
    </div>
  </header>

  <main>
    <div class="container" id="app">

      <div class="state-loading" id="state-loading">
        <div class="spinner"></div>
        <p>Vérification de la carte en cours…</p>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    /* ================================================================
       CONFIG
    ================================================================ */
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxqsoRAJXxa1nSE0wSy_NhYq-j8kdFYrAqfJuz3zW-jtIVk7hXkC1Bx7rgyrdC3wYHf/exec';

    /* ================================================================
       UTILITAIRES
    ================================================================ */
    function formatDate(str) {
      if (!str) return '—';
      const d = new Date(str);
      if (isNaN(d.getTime())) return str;
      return d.toLocaleDateString('fr-BJ', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    function esc(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    /* ================================================================
       APPEL GAS
    ================================================================ */
    async function verifierToken(token) {
      const resp = await fetch(GAS_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'text/plain' },
        body:    JSON.stringify({ action: 'carte_verifier', token })
      });
      return resp.json();
    }

    /* ================================================================
       RENDU — ERREUR
    ================================================================ */
    function renderErreur(message, options = {}) {
      const retour = options.avecRetour === false ? '' : `
          <button class="btn-verifier" style="margin-top:24px;" onclick="renderFormulaire()">
            <iconify-icon icon="tabler:arrow-left"></iconify-icon> Vérifier un autre document
          </button>`;
      document.getElementById('app').innerHTML = `
        <div class="state-error">
          <div class="icon-wrap">
            <iconify-icon icon="tabler:shield-x"></iconify-icon>
          </div>
          <h2>${esc(options.titre || 'Document invalide')}</h2>
          <p>${esc(message)}</p>
          ${retour}
        </div>`;
    }

    /* ================================================================
       RENDU — FORMULAIRE DE VÉRIFICATION MANUELLE
       (arrivée sans QR, via /verifier-document tapé à la main)
    ================================================================ */
    function renderFormulaire(messageErreur) {
      // Nettoie l'URL — si on revient ici après un ?t= invalide ou après
      // "Vérifier un autre document", pas de raison de garder le token
      // dans la barre d'adresse.
      if (window.location.search) {
        window.history.replaceState({}, '', window.location.pathname);
      }

      document.getElementById('app').innerHTML = `
        <div class="state-form">
          <div class="icon-wrap">
            <iconify-icon icon="tabler:certificate"></iconify-icon>
          </div>
          <h2>Authentifier un document LQD Service</h2>
          <p class="intro">
            Entrez le numéro de référence imprimé en bas de l'attestation,
            de la fiche apprenant, du badge de certification ou du document
            de travail (référence RH-…).
          </p>

          <label class="form-label" for="input-ref">Numéro de référence</label>
          <input type="text" class="form-input" id="input-ref" placeholder="Ex. LQD-260905-W9RA" autocomplete="off" autocapitalize="characters" />
          <p class="form-hint">Format « Réf : ... » — visible en bas du document, à côté ou en dessous du QR code.</p>

          <div class="form-erreur" id="form-erreur"></div>

          <button class="btn-verifier" id="btn-verifier-id" onclick="verifierParId()">
            <iconify-icon icon="tabler:search"></iconify-icon> Vérifier ce document
          </button>
        </div>`;

      const input = document.getElementById('input-ref');
      if (messageErreur) {
        const err = document.getElementById('form-erreur');
        err.textContent = messageErreur;
        err.style.display = 'block';
      }
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') verifierParId(); });
      input.focus();
    }

    async function verifierParId() {
      const input = document.getElementById('input-ref');
      const btn   = document.getElementById('btn-verifier-id');
      const err   = document.getElementById('form-erreur');
      const id    = input.value.trim().toUpperCase();

      err.style.display = 'none';

      if (!id) {
        err.textContent = 'Entrez le numéro de référence du document.';
        err.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<iconify-icon icon="tabler:loader-2" style="animation:spin 0.8s linear infinite"></iconify-icon> Vérification…';

      try {
        const resp = await fetch(GAS_URL, {
          method:  'POST',
          headers: { 'Content-Type': 'text/plain' },
          body:    JSON.stringify({ action: 'verifier_document_par_id', id })
        });
        const result = await resp.json();

        if (result.status === 'success' && result.document && result.document.typeDoc === 'travail') {
          renderDocumentTravail(result.document);
        } else if (result.status === 'success') {
          renderCarte(result.document, null, { simplifie: true });
        } else {
          renderFormulaire(result.message || "Aucun document ne correspond à ce numéro de référence.");
        }
      } catch (e) {
        renderFormulaire('Impossible de contacter le serveur de vérification. Vérifiez votre connexion et réessayez.');
        console.error('[verifierParId]', e);
      }
    }

    /* ================================================================
       RENDU — ATTESTATION / CERTIFICAT DE TRAVAIL (référence RH-...)
       Données figées à la délivrance ; un document annulé par
       l'employeur est signalé comme tel.
    ================================================================ */
    function renderDocumentTravail(d) {
      const nom = esc(String(d.nom || '').toUpperCase()) + ' ' + esc(d.prenoms);
      if (d.statut === 'Annulée') {
        renderErreur(`Le document ${d.ref} (${d.type}) établi au nom de ${String(d.nom || '').toUpperCase()} ${d.prenoms} a été annulé par l'employeur` + (d.motifAnnulation ? ` : ${d.motifAnnulation}.` : '.') + ' Il ne doit plus être accepté.', { titre: 'Document annulé' });
        return;
      }
      const ligne = (l, v) => `<div style="display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #EEF0F2;font-size:14px;"><span style="color:#6B7280;">${l}</span><strong style="text-align:right;">${v}</strong></div>`;
      document.getElementById('app').innerHTML = `
        <div class="state-form">
          <div class="icon-wrap" style="background:rgba(29,158,117,0.12);"><iconify-icon icon="tabler:shield-check" style="color:#1D9E75;"></iconify-icon></div>
          <h2>Document authentique</h2>
          <p class="intro">Ce document a bien été délivré par LES QUALITÉS DE DIEU SERVICE SARL. Comparez les informations ci-dessous avec le document présenté.</p>
          ${ligne('Document', esc(d.type))}
          ${ligne('Référence', esc(d.ref))}
          ${ligne('Titulaire', nom)}
          ${ligne('Poste', esc(d.poste))}
          ${ligne(d.dateSortie ? 'Période d\'emploi' : 'En poste depuis le', d.dateSortie ? formatDate(d.dateEmbauche) + ' au ' + formatDate(d.dateSortie) : formatDate(d.dateEmbauche))}
          ${ligne('Délivré le', formatDate(d.dateDelivrance))}
          <button class="btn-verifier" style="margin-top:24px;" onclick="renderFormulaire()">
            <iconify-icon icon="tabler:arrow-left"></iconify-icon> Vérifier un autre document
          </button>
        </div>`;
    }

    /* ================================================================
       RENDU — EXPIRÉ
    ================================================================ */
    function renderExpire(apprenant) {
      document.getElementById('app').innerHTML = `
        <div class="state-expired">
          <div class="icon-wrap">
            <iconify-icon icon="tabler:clock-x" style="color:var(--orange)"></iconify-icon>
          </div>
          <h2>Carte expirée</h2>
          <p>
            La carte de <strong>${esc(apprenant.prenom)} ${esc(apprenant.nom)}</strong>
            (${esc(apprenant.id)}) a expiré le <strong>${formatDate(apprenant.dateFin)}</strong>.
          </p>
          <button class="btn-verifier" style="margin-top:24px;" onclick="renderFormulaire()">
            <iconify-icon icon="tabler:arrow-left"></iconify-icon> Vérifier un autre document
          </button>
        </div>`;
    }

    /* ================================================================
       RENDU — CARTE VALIDE
       options.simplifie = true : vérification par numéro de référence
       (sans QR) — l'apprenant ne fournit ni photo ni date de naissance
       dans ce cas, on n'affiche que ce qui est déjà imprimé en clair sur
       le document (voir verifierDocumentParId côté GAS).
    ================================================================ */
    function renderCarte(a, tokenBrut, options = {}) {
      const simplifie = !!options.simplifie;
      const estStage  = a.source === 'candidature-stage';

      const photoHtml = a.photoUrl
        ? `<img src="${esc(a.photoUrl)}" alt="Photo" onerror="this.parentElement.innerHTML='<iconify-icon icon=\\'tabler:user\\' class=\\"no-photo\\"></iconify-icon>'"/>`
        : `<iconify-icon icon="tabler:user" class="no-photo"></iconify-icon>`;

      const maintenant = new Date();

      // Sexe et date de naissance retirés du rendu — ce sont des mentions
      // d'état civil, hors de propos sur un badge professionnel dont le
      // rôle est d'authentifier une formation, pas d'identifier une
      // personne. Remplacés par un statut de formation, plus pertinent
      // pour qui consulte cette page (employeur, tiers).
      const dateFinObj = a.dateFin ? new Date(a.dateFin) : null;
      const enCours     = dateFinObj && !isNaN(dateFinObj.getTime()) && maintenant < dateFinObj;

      // Le nom d'affichage d'une formation/pack (CONFIG.NOMS_AFFICHAGE_
      // PUBLIC côté GAS) peut porter un sous-titre séparé par un tiret
      // cadratin, ex. "Pack 3 Filières — Bureautique, Graphisme &
      // Sérigraphie" : on le scinde ici en (titre en gras / sous-titre
      // gris) pour retrouver la mise en page à deux niveaux de la
      // maquette. Un parcours multi-filières (séparateur ' | ') est
      // simplement rejoint en une liste lisible, sans sous-titre.
      function _formatFiliereCarte(filiereStr) {
        const brut = String(filiereStr || '');
        if (brut.includes(' | ')) {
          return { titre: brut.split(' | ').map(s => s.trim()).join(', '), sousTitre: '' };
        }
        const sepIdx = brut.indexOf(' — ');
        if (sepIdx > -1) {
          return { titre: brut.slice(0, sepIdx), sousTitre: brut.slice(sepIdx + 3) };
        }
        return { titre: brut, sousTitre: '' };
      }
      const filiereFmt = _formatFiliereCarte(a.filiere);

      const ligneNiveau = a.niveauAtteint ? `
            <div class="info-row compact">
              <div class="info-icon"><iconify-icon icon="tabler:certificate"></iconify-icon></div>
              <div class="info-text">
                <div class="info-label">Niveau atteint</div>
                <div class="info-value">${esc(a.niveauAtteint)}</div>
              </div>
            </div>` : '';

      const ligneFin = a.dateFin ? `
            <div class="info-row compact">
              <div class="info-icon"><iconify-icon icon="tabler:calendar-due"></iconify-icon></div>
              <div class="info-text">
                <div class="info-label">${estStage ? 'Fin de stage' : 'Fin de validité'}</div>
                <div class="info-value">${formatDate(a.dateFin)}</div>
              </div>
            </div>` : '';

      const boutonRetour = simplifie ? `
          <button class="btn-verifier" style="background:var(--white);color:var(--teal);border:1.5px solid var(--border);margin-top:12px;" onclick="renderFormulaire()">
            <iconify-icon icon="tabler:arrow-left"></iconify-icon> Vérifier un autre document
          </button>` : '';

      document.getElementById('app').innerHTML = `
        <div class="carte-wrap" id="carte-wrap">

          <div class="id-card" id="carte-body">

            <div class="id-card-header">
              <div class="header-logo-badge">
                <img src="icons/logo-lqd-v2.jpg" alt="LQD Service"/>
                <strong>LQD SERVICE</strong>
                <span>Former pour bâtir</span>
              </div>
              <div class="header-brand-text">
                <strong>LES QUALITÉS DE DIEU SERVICE</strong>
                <span class="header-tagline">Formation&nbsp;|&nbsp;Compétences&nbsp;|&nbsp;Avenir</span>
                <em>Carte d'apprentissage officielle</em>
              </div>
            </div>

            ${simplifie ? '' : `
            <div class="id-card-photo-wrap">
              <div class="id-card-photo">${photoHtml}</div>
            </div>`}

            <div class="id-card-identite">
              <div class="apprenant-prenom">${esc(a.prenom)}</div>
              <div class="apprenant-nomfamille"><span class="rule"></span>${esc(a.nom).toUpperCase()}<span class="rule"></span></div>
              <div class="apprenant-id">Réf. : <strong>${esc(a.id)}</strong></div>
            </div>

            <div class="id-card-panel">

              <div class="info-row">
                <div class="info-icon teal"><iconify-icon icon="${estStage ? 'tabler:briefcase' : 'tabler:school'}"></iconify-icon></div>
                <div class="info-text">
                  <div class="info-label">${estStage ? 'Stage' : 'Formation'}</div>
                  <div class="info-value">${esc(filiereFmt.titre)}</div>
                  ${filiereFmt.sousTitre ? `<div class="info-sub">${esc(filiereFmt.sousTitre)}</div>` : ''}
                </div>
              </div>

              <div class="info-row">
                <div class="info-icon gold"><iconify-icon icon="${enCours ? 'tabler:hourglass-high' : 'tabler:circle-check'}"></iconify-icon></div>
                <div class="info-text">
                  <div class="info-label">Statut</div>
                  <div class="info-value">${estStage ? (enCours ? 'Stage en cours' : 'Stage terminé') : (enCours ? 'Formation en cours' : 'Formation terminée')}</div>
                  <div class="info-sub">${enCours ? 'à la date de vérification.' : ''}</div>
                </div>
                <span class="statut-pill ${enCours ? 'en-cours' : 'termine'}">${enCours ? 'En cours' : 'Terminé'}</span>
              </div>

              <div class="id-card-divider"></div>

              <div class="info-row compact">
                <div class="info-icon"><iconify-icon icon="tabler:calendar"></iconify-icon></div>
                <div class="info-text">
                  <div class="info-label">${estStage ? 'Début de stage' : 'Début de formation'}</div>
                  <div class="info-value">${formatDate(a.dateEntree)}</div>
                </div>
              </div>
              ${ligneFin}
              ${ligneNiveau}

            </div>

            <div class="id-card-ribbon-wrap">
              <div class="id-card-ribbon">Plus de compétences<br/>pour un meilleur demain</div>
            </div>

          </div>

          <button class="btn-pdf" id="btn-pdf" onclick="telechargerPDF()">
            <iconify-icon icon="tabler:file-type-pdf"></iconify-icon>
            Télécharger en PDF
          </button>
          ${boutonRetour}

        </div>`;
    }

    /* ================================================================
       EXPORT PDF
    ================================================================ */
    async function telechargerPDF() {
      const btn = document.getElementById('btn-pdf');
      btn.disabled = true;
      btn.innerHTML = '<iconify-icon icon="tabler:loader-2" style="animation:spin 0.8s linear infinite"></iconify-icon> Génération…';

      try {
        const { jsPDF } = window.jspdf;
        const el        = document.getElementById('carte-body');

        const canvas = await html2canvas(el, {
          scale:            2,
          useCORS:          true,
          allowTaint:       false,
          backgroundColor:  '#FFFFFF'
        });

        const imgData = canvas.toDataURL('image/png');
        const pdf     = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a5' });

        const pageW   = pdf.internal.pageSize.getWidth();
        const pageH   = pdf.internal.pageSize.getHeight();
        const ratio   = canvas.height / canvas.width;
        const imgW    = pageW - 20;
        const imgH    = imgW * ratio;
        const offsetY = (pageH - imgH) / 2;

        pdf.addImage(imgData, 'PNG', 10, offsetY > 0 ? offsetY : 10, imgW, imgH);
        pdf.save(`carte-lqd-${Date.now()}.pdf`);
      } catch (err) {
        alert('Erreur lors de la génération du PDF. Réessayez.');
        console.error(err);
      }

      btn.disabled = false;
      btn.innerHTML = '<iconify-icon icon="tabler:file-type-pdf"></iconify-icon> Télécharger la carte en PDF';
    }

    /* ================================================================
       INIT — Lecture du token dans l'URL
    ================================================================ */
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const token  = params.get('t');
      const ref    = params.get('ref');

      // QR d'une attestation / d'un certificat de travail : ?ref=RH-...
      if (!token && ref) {
        renderFormulaire();
        document.getElementById('input-ref').value = ref;
        verifierParId();
        return;
      }

      if (!token) {
        // Arrivée via /verifier-document tapé à la main (pas de QR scanné,
        // donc pas de token signé dans l'URL) — on propose la vérification
        // manuelle par numéro de référence plutôt qu'un message d'erreur.
        renderFormulaire();
        return;
      }

      try {
        const result = await verifierToken(token);

        if (result.status === 'success') {
          renderCarte(result.apprenant, token);
        } else if (result.status === 'expired') {
          renderExpire(result.apprenant);
        } else {
          renderErreur(result.message || 'Cette carte est invalide ou a été falsifiée.');
        }
      } catch (err) {
        renderErreur('Impossible de contacter le serveur de vérification. Vérifiez votre connexion.');
        console.error(err);
      }
    }

    init();
  </script>
  <script>
    (function () {
      var GAS_URL = 'https://script.google.com/macros/s/AKfycbxqsoRAJXxa1nSE0wSy_NhYq-j8kdFYrAqfJuz3zW-jtIVk7hXkC1Bx7rgyrdC3wYHf/exec';
      async function chargerBandeau() {
        try {
          var resp = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'bandeau_get_public' })
          });
          var result = await resp.json();
          if (result.status === 'success' && result.actif && result.messages && result.messages.length > 0) {
            var el = document.getElementById('bandeau-texte');
            var messages = result.messages;
            var dureeMs  = (result.dureeRotationSec || 12) * 1000;
            var index = 0;

            el.textContent = messages[0];
            document.getElementById('bandeau-info').style.display = 'block';

            if (messages.length > 1) {
              setInterval(function () {
                el.classList.add('sortant');
                setTimeout(function () {
                  index = (index + 1) % messages.length;
                  el.textContent = messages[index];
                  el.classList.remove('sortant');
                  el.classList.add('entrant');
                  setTimeout(function () { el.classList.remove('entrant'); }, 350);
                }, 350);
              }, dureeMs);
            }
          }
        } catch (e) {}
      }
      chargerBandeau();
    })();
  </script>
